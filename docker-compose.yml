services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      AUDIT_LOG: /var/audit/audit.jsonl
    volumes: ["audit:/var/audit"]
    depends_on:
      elasticsearch: {condition: service_healthy}
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      retries: 30
volumes:
  audit:
