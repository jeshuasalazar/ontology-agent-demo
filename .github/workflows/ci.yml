name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: uvx ruff check . && uvx ruff format --check .
      - name: Tests
        run: uv run pytest -q
      - name: Golden-set eval (planner accuracy + token bill)
        run: uv run python eval/run_eval.py
